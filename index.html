<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>UJV</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>

    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/table.css">
    <link rel="stylesheet" href="./styles/modal.css">
    <link rel="stylesheet" href="./styles/modal-edit.css">
</head>

<body>
    <header>
        <div class="rgt-container">
            <h1 class="header-title">UJV</h1>
            <nav>
                <ul>
                    <li>Destinations <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Preffered Collections <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Experiences <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Our Programs <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Resources <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>About Us <img src="./public/icons/Icon.svg" alt=""></li>
                </ul>
            </nav>
        </div>
        <div class="lft-container">Sign in</div>
    </header>

    <main>

        <input type="checkbox" id="tripCreate" class="modal-toggle">
        <input type="checkbox" id="trip-eliminate" class="modal-toggle">
        <!-- <input type="checkbox" id="tripEdit" class="modal-toggle"> -->

        <section class="table-container">
            <div class="table-top">
                <h1>My Trips</h1>

                <label for="tripCreate" class="btn-open">+ Create Trip</label>
            </div>

            <div class="table">
                <input type="search" name="searchTrip" id="searchTrip" placeholder="Search by Client or Trip Name">

                <label for="status-select">Status</label>
                <select id="status-select">
                    <option value="">All</option>
                    <option value="Quoting">Quoting</option>
                    <option value="Traveled">Traveled</option>
                    <option value="Active Booking">Active Booking</option>
                </select>


                <table>
                    <thead>
                        <tr>
                            <th>Trip Name</th>
                            <th>Client Name</th>
                            <th>Travel Dates</th>
                            <th>Penalty Date</th>
                            <th>Total Amount</th>
                            <th>Commission</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tripsTableBody">

                    </tbody>
                </table>

            </div>
        </section>

        <div class="modal">
            <div class="modal-content">

                <h2>Create a New Trip</h2>
                <form id="tripForm">
                    <label for="tripName">Trip name *</label>
                    <input type="text" class="tripName" id="tripName" required>
                    <div class="inputs-create">
                        <label for="tripCreate" class="btn-cancel">Cancel</label>
                        <button type="submit">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal-eliminate ">
            <div class="modal-content">
                <h2>Conrfimr Eliminate Trip</h2>
                <form id="trip-form-eliminate">
                    <label for="tripName">Confirm name of the trip to delete*</label>
                    <input type="text" class="tripName" id="tripName" required>
                    <div class="inputs-create">
                        <label for="trip-eliminate" class="btn-cancel">Cancel</label>
                        <button type="submit">Eliminate</button>
                    </div>
                </form>
            </div>
        </div>

    </main>


    <script src="./src/validateTrip.js"></script>
    <script src="./src/defaultTrip.js"></script>
    <script src="./src/CRUDTrip.js"></script>
    <script src="./src/formHandler.js"></script>
    <script src="./src/main.js"></script>
    <script src="./src/filtrer/filtros.js"></script>
    <main>
    </main>
</body>

</html>
