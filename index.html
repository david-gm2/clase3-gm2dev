<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>UJV</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>

    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/table.css">
</head>

<body>
    <header>
        <div class="rgt-container">
            <h1 class="header-title">UJV</h1>
            <nav>
                <ul>
                    <li>Destinations <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Preffered Collections <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Experiences <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Our Programs <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>Resources <img src="./public/icons/Icon.svg" alt=""></li>
                    <li>About Us <img src="./public/icons/Icon.svg" alt=""></li>
                </ul>
            </nav>
        </div>
        <div class="lft-container">Sign in</div>
    </header>

    <main>
        <section class="table-container">
            <div class="table-top">
                <h1>My Trips</h1>

                <label for="tripCreate" class="btn-open">+ Create Trip</label>
            </div>

            <div class="table">
                <table>
                    <thead>
                        <tr>
                            <th>Trip Name</th>
                            <th>Client Name</th>
                            <th>Travel Dates</th>
                            <th>Penalty Date</th>
                            <th>Total Amount</th>
                            <th>Commission</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tripsTableBody">

                    </tbody>
                </table>

            </div>
        </section>
    <main>
    </main>
</body>

</html>
